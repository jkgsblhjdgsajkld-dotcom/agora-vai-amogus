name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - run: dotnet restore SemLimites.csproj
      - name: Listar pacote do jogo
        shell: pwsh
        run: |
          Get-ChildItem "$env:USERPROFILE\.nuget\packages\amongus.gamelibs.steam" -Recurse | Select-Object -First 80 | ForEach-Object { $_.FullName }
      - run: dotnet build SemLimites.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: SemLimites-dll
          path: bin/Release/net6.0/SemLimites.dll
